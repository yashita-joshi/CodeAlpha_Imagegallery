<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Frames — a small photo gallery</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="top">
    <h1>Frames</h1>
    <p class="intro">Pictures I liked enough to keep. Filter by subject, click any photo to open it.</p>
    <nav class="filters" id="filters" aria-label="Filter photos by category"></nav>
  </header>

  <main>
    <p class="count" id="count" aria-live="polite"></p>
    <section class="grid" id="grid"></section>
  </main>

  <div class="lightbox" id="lightbox" role="dialog" aria-modal="true" aria-label="Photo viewer" hidden>
    <button class="lb-btn lb-close" id="lbClose" aria-label="Close viewer">&times;</button>
    <button class="lb-btn lb-nav lb-prev" id="lbPrev" aria-label="Previous photo">&#8249;</button>
    <figure class="lb-figure">
      <img id="lbImg" alt="">
      <figcaption id="lbCaption"></figcaption>
    </figure>
    <button class="lb-btn lb-nav lb-next" id="lbNext" aria-label="Next photo">&#8250;</button>
  </div>

  <script src="script.js"></script>
</body>
</html>
